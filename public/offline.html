<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0066A0">
    <title>Offline - Mitra Jaringan Global</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F4F7FA; color: #0F2233; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; }
        .card { margin: 16px; max-width: 360px; padding: 32px 24px; border-radius: 16px; background: #fff; box-shadow: 0 1px 3px rgba(15, 34, 51, .08); text-align: center; }
        img { width: 180px; height: auto; }
        h1 { margin: 24px 0 8px; font-size: 20px; font-weight: 800; }
        p { margin: 0 0 24px; color: #526477; font-size: 14px; line-height: 1.5; }
        button { height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #0066A0; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo-mjg.png" alt="Mitra Jaringan Global">
        <h1>Tidak ada koneksi</h1>
        <p>Data gudang & penjualan butuh internet supaya selalu terbaru. Cek koneksi, lalu coba lagi.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
